version: '3.8'

services:
  motobid-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motobid-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=motobid-production-super-secret-key-change-in-prod-2026
      - ANTI_SNIPE_WINDOW_MS=30000
      - EXTENSION_DURATION_MS=60000
      - MAX_EXTENSIONS=15
      - DB_PATH=/app/data/motobid.sqlite
    volumes:
      - motobid-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  motobid-data:
    driver: local
